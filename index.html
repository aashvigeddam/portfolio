<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Aashvi Geddam</title>
<style>
/* ============================================================
   aashvigeddam.com v2 — landing page
   Geometry: sebinjeon.com layout, rebuilt clean.
   Canvas: 1440 x 900 design units, cover-scaled to viewport.
   Edit positions in LAYOUT, assets in ASSETS (bottom of file).
   ============================================================ */
:root{ --ink:#fff; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#111}
body{font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink)}

.bg{position:fixed;inset:0;z-index:0}
.bg video,.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:saturate(.7) brightness(1.15) contrast(.96)}  /* wash toward the reference grade */
.bg .scrim{position:absolute;inset:0;background:rgba(255,255,255,.18)}

#canvas{position:fixed;top:50%;left:50%;width:1440px;height:900px;
  transform-origin:center center;z-index:1}

.item{position:absolute}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;
  border:2px dashed rgba(255,255,255,.75);background:rgba(0,0,0,.28);
  font-size:13px;letter-spacing:.06em;line-height:1.5;padding:8px;
  width:100%;height:100%;color:#fff;text-transform:uppercase}
.item img,.item video{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.28))}

/* nav + credit are pinned to the viewport, not the canvas, so they never
   crop when the canvas cover-scales past the screen edges */
nav{position:fixed;top:34px;left:0;right:0;display:flex;align-items:center;
  font-size:17px;letter-spacing:.04em;z-index:5;
  text-shadow:0 1px 8px rgba(0,0,0,.35)}
nav .name{position:absolute;left:44px;font-size:22px;letter-spacing:.02em}
nav .mono{position:absolute;left:50%;transform:translateX(-50%);top:-8px}
nav .mono img{height:84px;width:auto;display:block;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.55)) drop-shadow(0 2px 10px rgba(0,0,0,.35))}
nav .links{position:absolute;right:44px;display:flex;gap:52px;text-transform:uppercase}
nav a{color:#fff;text-decoration:none;opacity:.92}
nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:5px}

.doorlabel{font-size:22px;letter-spacing:.14em;text-transform:uppercase;
  text-align:center;text-shadow:0 1px 10px rgba(0,0,0,.4)}

/* ---- skills charm cluster ----------------------------------------
   A compact pile of enamel-charm skill icons (see SKILLS array).
   Hovering the pile loosens it outward; hovering one charm pulls it
   out of the pile. Wrappers (.skill) never move — only the inner
   .charm animates — so hit areas stay stable while charms travel. */
#skills .skill{position:absolute;display:flex;align-items:center;justify-content:center;
  padding:8px;outline:none}
#skills .charm{position:relative;width:100%;height:100%;
  transform:rotate(var(--r));
  filter:drop-shadow(0 2px 3px rgba(55,45,32,.32));
  transition:transform var(--dur,.38s) cubic-bezier(.32,1.28,.46,1), filter .38s ease;
  will-change:transform}
#skills .charm img{width:100%;height:100%;object-fit:contain;display:block;filter:none}
/* group hover: the pile breathes open */
@media (hover:hover){
  #skills:hover .charm{transform:translate(var(--sx),var(--sy)) rotate(var(--r))}
  #skills .skill:hover .charm,#skills .skill:focus-visible .charm{
    transform:translate(calc(var(--sx) + var(--hx)),calc(var(--sy) + var(--hy)))
      rotate(var(--rh)) scale(1.05);
    filter:drop-shadow(0 6px 9px rgba(55,45,32,.34))}
}
#skills .skill:hover,#skills .skill:focus-visible{z-index:30}
/* touch: tapped patch pulls out the same way */
#skills .skill.picked .charm{transform:translate(var(--hx),var(--hy)) rotate(var(--rh)) scale(1.05);
  filter:drop-shadow(0 6px 9px rgba(55,45,32,.34))}
#skills .skill.picked{z-index:30}
@media (prefers-reduced-motion:reduce){
  #skills .charm{transition:filter .2s ease}
  #skills:hover .charm{transform:rotate(var(--r))}
  #skills .skill:hover .charm,#skills .skill:focus-visible .charm,#skills .skill.picked .charm{
    transform:rotate(var(--r))}
}

.device{cursor:pointer}
.device .frame{position:absolute;inset:0;z-index:2;pointer-events:none}
.device .screen{position:absolute;z-index:1;background:#0b0b0c;overflow:hidden}
.device .screen video{width:100%;height:100%;object-fit:contain;display:block}

@media (max-width:640px){
  nav{top:18px;font-size:12px}
  nav .name{left:16px;font-size:15px}
  nav .mono{display:none}
  nav .links{right:16px;gap:16px}
}

@media (prefers-reduced-motion:reduce){ .bg video{display:none} }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <img src="assets/sf-poster.jpg" alt="">
  <video autoplay muted loop playsinline poster="assets/sf-poster.jpg">
    <source src="assets/sf-background.mp4" type="video/mp4">
  </video>
  <div class="scrim"></div>
</div>

<nav>
  <span class="name">aashvi geddam</span>
  <span class="mono"><img src="assets/logo.png" alt="AG monogram"></span>
  <span class="links">
    <a href="#">About</a><a href="#">Work</a><a href="#">Play</a><a href="#">Contact</a>
  </span>
</nav>

<div id="canvas">
  <div class="item" id="notebook"></div>

  <div class="item" id="photo"><div class="ph">YOUR PHOTO<br>photobooth style</div></div>
  <div class="item" id="scrap-hi"></div>
  <div class="item" id="scrap-welcome"></div>

  <div class="item" id="doodle-sun"></div>
  <div class="item" id="doodle-airplane"></div>
  <div class="item" id="doodle-disco"></div>
  <div class="item" id="doodle-dragonfly"><div class="ph">DRAGONFLY</div></div>
  <div class="item" id="doodle-apple"></div>

  <div class="item device" id="device" role="button" tabindex="0"
       aria-label="Experience — plays a preview video">
    <div class="ph">DEVICE PNG<br>+ SCREEN VIDEO on hover</div>
  </div>
  <div class="item doorlabel" id="label-exp">Experience</div>

  <div class="item" id="skills"></div>
  <div class="item doorlabel" id="label-cert">Skills</div>

  <div class="item" id="soc-mail"></div>
  <div class="item" id="soc-li"><div class="ph">LI</div></div>
  <div class="item" id="soc-gh"><div class="ph">GH</div></div>
  <div class="item" id="soc-ig"></div>
</div>

<script>
/* canvas coordinates (1440 x 900). w/h tuned to each asset's true aspect. */
const LAYOUT = {
  "notebook":       {x: 237, y: 314, w: 205, h: 228, r: -2, href: null},
  "scrap-hi":       {x: 615, y: 163, w: 190, h:  89, r:  0},
  "photo":          {x: 535, y: 216, w: 320, h: 375, r:  0},
  "scrap-welcome":  {x: 557, y: 566, w: 276, h:  76, r:  0},
  "doodle-disco":   {x: 500, y: 239, w:  63, h:  70, r:  0},
  "doodle-dragonfly":{x: 479, y: 364, w:  82, h:  77, r:  0},
  "doodle-apple":   {x: 484, y: 483, w:  81, h:  85, r:  0},
  "doodle-sun":     {x: 842, y: 252, w:  72, h:  72, r:  0},
  "doodle-airplane":{x: 831, y: 382, w: 100, h: 100, r:  0},
  "device":         {x: 960, y: 176, w: 300, h: 198, r:  0},
  "label-exp":      {x: 960, y: 382, w: 300, h:  30, r:  0},
  "skills":         {x: 950, y: 415, w: 290, h: 250, r:  0},
  "label-cert":     {x: 960, y: 672, w: 280, h:  30, r:  0},
  /* charm boxes sized so the icon BODIES render equal — each PNG carries a
     different amount of clasp/dangle around the body */
  "soc-mail":       {x: 533, y: 692, w:  69, h:  54, r: -3, href: "mailto:aashvi.geddam@gmail.com"},
  "soc-ig":         {x: 636, y: 695, w:  58, h:  49, r:  2, href: "https://www.instagram.com/aashvigeddam/"},
  "soc-gh":         {x: 716, y: 694, w:  54, h:  56, r: -2, href: "https://github.com/aashvigeddam"},
  "soc-li":         {x: 804, y: 691, w:  57, h:  54, r:  3, href: "https://www.linkedin.com/in/aashvi-geddam"},
};

const ASSETS = {
  bg: "assets/sf-background.mp4",
  bgPoster: "assets/sf-poster.jpg",
  "notebook": "assets/notebook.png",
  notebookOpen: "assets/notebook-open.png",  /* hover swap on #notebook */
  "doodle-sun": "assets/doodle-sun.png",
  "doodle-airplane": "assets/doodle-airplane.png",
  "doodle-disco": "assets/doodle-disco.png",
  "doodle-apple": "assets/doodle-apple.png",
  "soc-mail": "assets/soc-mail.png",
  "soc-li": "assets/soc-li.png",
  "soc-gh": "assets/soc-gh.png",
  "soc-ig": "assets/soc-ig.png",
  "doodle-dragonfly": "assets/doodle-dragonfly.png",
  "photo": "assets/photo.png",
  "scrap-hi": "assets/scrap-hi.png",
  "scrap-welcome": "assets/scrap-welcome.png",
  deviceFrame: "assets/camera.png",
  deviceVideo: "assets/experience-demo.mp4",
  deviceScreen: {x: 0.0762, y: 0.3195, w: 0.4721, h: 0.5320},
};

for (const [id, p] of Object.entries(LAYOUT)) {
  const el = document.getElementById(id);
  if (!el) continue;
  el.style.left = p.x + "px"; el.style.top = p.y + "px";
  el.style.width = p.w + "px"; el.style.height = p.h + "px";
  el.style.transform = "rotate(" + (p.r || 0) + "deg)";
  if (ASSETS[id]) {
    const img = '<img src="' + ASSETS[id] + '" alt="">';
    el.innerHTML = p.href ? '<a href="' + p.href + '">' + img + "</a>" : img;
  }
}

/* background video: play at a fraction of real speed */
const bgv = document.querySelector(".bg video");
if (bgv) {
  const SLOW = 0.35;
  bgv.defaultPlaybackRate = SLOW;
  bgv.playbackRate = SLOW;
  bgv.addEventListener("play", () => { bgv.playbackRate = SLOW; });
}

/* notebook: closed -> open on hover, slightly larger, same tilt */
if (ASSETS.notebookOpen) {
  const nb = document.getElementById("notebook");
  const img = nb.querySelector("img");
  const tilt = "rotate(" + LAYOUT.notebook.r + "deg)";
  new Image().src = ASSETS.notebookOpen;  /* preload so the swap is instant */
  nb.style.transition = "transform .25s ease";
  const open = () => { img.src = ASSETS.notebookOpen; nb.style.transform = "rotate(-18deg) scale(1.7)"; nb.style.zIndex = 6; };
  const shut = () => { img.src = ASSETS.notebook; nb.style.transform = tilt; nb.style.zIndex = ""; };
  if (matchMedia("(hover:hover)").matches) {
    nb.addEventListener("mouseenter", open);
    nb.addEventListener("mouseleave", shut);
  } else {
    nb.addEventListener("click", () => nb.dataset.open ? (delete nb.dataset.open, shut()) : (nb.dataset.open = 1, open()));
  }
}

/* ---- skills patch cluster ----------------------------------------
   Add / remove / reorder skills here. Coordinates are the patch's
   CENTER inside the #skills box (see LAYOUT.skills for the box).
     patch   paper-patch PNG (name is printed on the artwork)
     cx,cy   resting center
     w       width in px; height follows the patch aspect (~0.865)
     r       resting tilt; hovering straightens toward a third of it
     spread  how far it drifts when the pile is hovered (from center)
     pull    extra travel when this patch itself is hovered
     z       resting stack order (higher = on top of the pile)      */
const PATCH_AR = 0.865;   /* w/h of the patch artwork */
const SKILLS = [
  /* z runs high on the top row so each patch's printed name stays clear */
  {name:"Figma",        patch:"assets/patches/figma.png",   cx:110, cy: 56, w:71, r:-4, spread:[ -7,-14], pull:[ -4,-8], z:6},
  {name:"Claude",       patch:"assets/patches/claude.png",  cx:176, cy: 50, w:73, r: 3, spread:[  7,-15], pull:[  4,-8], z:7},
  {name:"GitHub",       patch:"assets/patches/github.png",  cx: 74, cy:124, w:70, r: 5, spread:[-17,  0], pull:[-10, 0], z:4},
  {name:"Canva",        patch:"assets/patches/canva.png",   cx:143, cy:122, w:76, r:-2, spread:[  0, -4], pull:[  0,-8], z:5},
  {name:"ChatGPT",      patch:"assets/patches/chatgpt.png", cx:212, cy:127, w:72, r: 4, spread:[ 17,  1], pull:[ 10, 1], z:3},
  {name:"Google tools", patch:"assets/patches/google.png",  cx:110, cy:194, w:71, r:-5, spread:[ -6, 14], pull:[ -4, 8], z:2},
  {name:"Excel",        patch:"assets/patches/excel.png",   cx:176, cy:197, w:72, r: 2, spread:[  6, 13], pull:[  4, 7], z:1},
];

const skillsBox = document.getElementById("skills");
if (skillsBox) {
  const PADW = 8;  /* .skill padding — keeps the hit area a ring larger than the patch */
  SKILLS.forEach((s, i) => {
    const w = document.createElement("div");
    w.className = "skill";
    w.tabIndex = 0;
    w.setAttribute("role", "img");
    w.setAttribute("aria-label", s.name);
    const bw = s.w + PADW * 2, bh = Math.round(s.w / PATCH_AR) + PADW * 2;
    w.style.left = (s.cx - bw / 2) + "px";
    w.style.top = (s.cy - bh / 2) + "px";
    w.style.width = bw + "px";
    w.style.height = bh + "px";
    w.style.zIndex = s.z;
    w.style.setProperty("--r", s.r + "deg");
    w.style.setProperty("--rh", (s.r / 3).toFixed(1) + "deg");
    w.style.setProperty("--sx", s.spread[0] + "px");
    w.style.setProperty("--sy", s.spread[1] + "px");
    w.style.setProperty("--hx", s.pull[0] + "px");
    w.style.setProperty("--hy", s.pull[1] + "px");
    w.style.setProperty("--dur", (0.34 + (i % 4) * 0.035).toFixed(3) + "s");
    const c = document.createElement("div");
    c.className = "charm";
    const img = document.createElement("img");
    img.src = s.patch;
    img.alt = "";
    c.appendChild(img);
    w.appendChild(c);
    skillsBox.appendChild(w);
  });
  /* touch devices: tap pulls a charm out, tap elsewhere settles it back */
  if (!matchMedia("(hover:hover)").matches) {
    skillsBox.addEventListener("click", e => {
      const hit = e.target.closest(".skill");
      skillsBox.querySelectorAll(".skill.picked").forEach(el => { if (el !== hit) el.classList.remove("picked"); });
      if (hit) hit.classList.toggle("picked");
    });
  }
}

const W = 1440, H = 900;
function fit(){
  const s = Math.max(innerWidth / W, innerHeight / H);
  document.getElementById("canvas").style.transform =
    "translate(-50%,-50%) scale(" + s + ")";
}
addEventListener("resize", fit); fit();

if (ASSETS.deviceFrame) {
  const d = document.getElementById("device"), s = ASSETS.deviceScreen;
  d.innerHTML =
    '<div class="screen" style="left:' +
    (s.x*100) + '%;top:' + (s.y*100) + '%;width:' + (s.w*100) + '%;height:' + (s.h*100) + '%">' +
    (ASSETS.deviceVideo
      ? '<video muted loop playsinline preload="metadata" src="' + ASSETS.deviceVideo + '"></video>'
      : '') +
    '</div>' +
    '<img class="frame" src="' + ASSETS.deviceFrame + '" alt="">';
  const v = d.querySelector("video");
  if (v) {
    if (matchMedia("(hover:hover)").matches) {
      d.addEventListener("mouseenter", () => v.play());
      d.addEventListener("mouseleave", () => v.pause());
    } else {
      d.addEventListener("click", () => v.paused ? v.play() : v.pause());
    }
    d.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
    });
  }
}
</script>
</body>
</html>
